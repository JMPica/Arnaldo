# Despliega APEX en Cloudflare (plan gratuito). Requiere los secretos del
# repositorio CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID y APEX_PASSWORD.
# Opcionales: APEX_TOTP_SECRET, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID.
name: apex-deploy
on:
  push:
    branches: [claude/apex-trading]
    paths: [src/**, public/**, migrations/**, wrangler.toml, research/out/champion.json, package-lock.json]
  workflow_call:
permissions:
  contents: read
concurrency: apex-deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APEX_PASSWORD: ${{ secrets.APEX_PASSWORD }}
    steps:
      - name: Comprobar secretos
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$APEX_PASSWORD" ]; then
            echo "::notice::Faltan secretos de Cloudflare o APEX_PASSWORD: se omite el despliegue (ver docs/INTERVENCIONES.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
        with: { ref: claude/apex-trading }
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with: { node-version: 22, cache: npm }
      - if: steps.check.outputs.ready == 'true'
        run: npm ci
      - name: Pruebas antes de desplegar
        if: steps.check.outputs.ready == 'true'
        run: npx tsc --noEmit -p . && npx vitest run
      - name: Preparar Cloudflare (D1 y subdominio)
        if: steps.check.outputs.ready == 'true'
        run: node scripts/cf-setup.mjs
      - name: Migraciones de la base de datos
        if: steps.check.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply apex --remote
      - name: Desplegar el Worker
        if: steps.check.outputs.ready == 'true'
        run: npx wrangler deploy > deploy.log 2>&1 || (cat deploy.log | grep -v workers.dev; exit 1)
      - name: Secretos del Worker
        if: steps.check.outputs.ready == 'true'
        env:
          APEX_TOTP_SECRET: ${{ secrets.APEX_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node scripts/hash-password.mjs | npx wrangler secret put OWNER_PASSWORD_HASH > /dev/null
          node -e "process.stdout.write(require('crypto').createHmac('sha256', process.env.APEX_PASSWORD).update('apex-research-token').digest('hex'))" | npx wrangler secret put RESEARCH_TOKEN > /dev/null
          if [ -n "$APEX_TOTP_SECRET" ]; then printf '%s' "$APEX_TOTP_SECRET" | npx wrangler secret put TOTP_SECRET > /dev/null; fi
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then printf '%s' "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN > /dev/null; fi
          if [ -n "$TELEGRAM_CHAT_ID" ]; then printf '%s' "$TELEGRAM_CHAT_ID" | npx wrangler secret put TELEGRAM_CHAT_ID > /dev/null; fi
          echo "Secretos configurados"
      - name: Comprobar que responde
        if: steps.check.outputs.ready == 'true'
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$APEX_URL/api/auth-info" || true)
            [ "$code" = "200" ] && { echo "APEX responde (200)"; exit 0; }
            sleep 10
          done
          echo "::error::El Worker no responde tras el despliegue"; exit 1
