name: MISE CI

on:
  push:
    paths: ['MISE/**', '.github/workflows/mise-ci.yml']
  pull_request:
    paths: ['MISE/**', '.github/workflows/mise-ci.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MISE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: MISE/package-lock.json
      - run: npm ci
      - run: python3 scripts/verificar_paquete.py
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: bash scripts/smoke-local-access.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: MISE/playwright-report
          retention-days: 7
