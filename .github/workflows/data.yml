name: apex-data
on:
  workflow_dispatch:
  push:
    branches: [claude/apex-trading]
    paths: [research/fetch/**]
permissions:
  contents: write
concurrency: apex-data
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas pyarrow huggingface_hub
      - run: python research/fetch/fetch_data.py
      - name: Commit data
        run: |
          git config user.name "apex-bot"
          git config user.email "apex-bot@users.noreply.github.com"
          git add research/data
          git commit -m "Datos históricos actualizados" || exit 0
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}
