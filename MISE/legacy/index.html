    main{width:100%;min-width:0}.content{max-width:1390px;margin:auto;padding:35px clamp(18px,3.8vw,56px) 84px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:28px}.kicker{color:var(--green);text-transform:uppercase;letter-spacing:1.9px;font-weight:800;font-size:10px;margin-bottom:5px}.title{font-family:Georgia,'Times New Roman',serif;font-size:clamp(30px,3vw,40px);font-weight:500;letter-spacing:-1.6px;margin:0;line-height:1.18}.sub{color:var(--muted);font-size:13px;margin-top:8px}.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.btn{background:var(--forest);color:#fff;border:1px solid var(--forest);padding:10px 15px;border-radius:10px;white-space:nowrap;font-weight:650;font-size:12px;display:inline-flex;align-items:center;gap:8px;justify-content:center}.btn:hover{background:#24553d}.btn.light{background:#fff;border-color:var(--line);color:var(--ink)}.btn.light:hover{background:var(--light)}.btn.sm{padding:7px 11px;font-size:11px}.btn.warn{color:var(--danger);background:#fff;border-color:#eedad5}.btn:focus-visible,.nav button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #86b997;outline-offset:2px}
    .card{border:1px solid var(--line);background:var(--paper);border-radius:16px;box-shadow:var(--shadow)}.hero{padding:28px;background:linear-gradient(120deg,#142824 0%,#254d3b 100%);border:0;color:#f7fff8;position:relative;overflow:hidden;margin-bottom:19px}.hero:after{content:'M';font:200px Georgia;opacity:.06;position:absolute;right:38px;top:-73px;pointer-events:none}.hero-row{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;position:relative;z-index:1}.hero h2{font:34px Georgia;margin:6px 0 9px;letter-spacing:-1.3px;line-height:1.15;font-weight:400}.hero p{color:#bfdbca;max-width:530px;margin:0}.hero button{border:1px solid #b8d4bb;background:#d1e5cf;color:#183426;padding:11px 16px;border-radius:9px;font-weight:700;white-space:nowrap}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:18px}.metric{padding:21px}.metric .lbl{color:var(--muted);font-size:11px}.metric .val{font-size:27px;font-weight:690;letter-spacing:-1.2px;margin:8px 0 3px;white-space:nowrap}.metric .note{font-size:11px;color:#6e8a78}.positive{color:var(--green)}.negative{color:var(--danger)}.two-col{display:grid;grid-template-columns:1.45fr 1fr;gap:17px}.panel{padding:21px}.panel h3{font-size:15px;margin:0 0 5px}.panel .desc{font-size:11px;color:var(--muted);margin:0 0 19px}.panel-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.panel-heading h3{margin:0}.legend{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--green);margin-right:7px}.row-list{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:12px 0;gap:14px}.row-list:last-child{border-bottom:0}.secondary{font-size:11px;color:var(--muted)}.emphasis{font-weight:650}.pill{display:inline-block;padding:3px 8px;border-radius:99px;background:var(--mint);color:#346e51;font-weight:650;font-size:10px;white-space:nowrap}.pill.draft{background:#f0f2f0;color:#738 ;gap:8px}.item-card strong{font-size:18px}.item-card .links{display:flex;gap:8px}.bar-track{height:7px;width:100%;border-radius:8px;background:#edf2ed;overflow:hidden;margin-top:7px}.bar-fill{height:100%;background:var(--green);border-radius:8px}.event-card{padding:20px}.event-top{display:flex;justify-content:space-between;gap:8px;align-items:center}.event-date{color:#427453;font-size:11px;font-weight:700}.event-card h3{font-family:Georgia;font-size:22px;font-weight:400;margin:12px 0 4px}.event-card .meta{color:var(--muted);font-size:11px;margin-bottom:14px}.event-card .totals{border-top:1px solid var(--line);padding-top:12px;display:flex;justify-content:space-between}.event-card .totals strong{font-size:17px}.event-card button{margin-top:15px;width:100%}.eyebrow{font-size:10px;font-weight:800;text-transform:uppercase;color:#78917d;letter-spacing:1.3px}.recipe-lines{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}.chip{padding:5px 9px;background:#edf4ec;border-radius:8px;font-size:11px;color:#52765b;display:inline-block;margin:3px 4px 2px 0}
    .modal-layer{position:fixed;inset:0;z-index:100;background:#0918119e;display:flex;justify-content:center;align-items:flex-start;padding:clamp(12px,5vh,44px) 12px;overflow-y:auto}.modal{width:100%;max-width:700px;border-radius:18px;background:#fff;box-shadow:0 25px 80px #00140860;overflow:hidden}.modal.wide{max-width:850px}.modal-head{padding:23px 26px 18px;border-bottom:1px solid var(--line);display:flex;align-items:start;justify-content:space-between}.modal h2{font:27px Georgia;margin:0;font-weight:400}.modal-head .sub{margin-top:4px}.close{border:0;background:#f1f5f1;color:var(--ink);font-size:24px;width:32px;height:32px;line-height:28px;border-radius:50%}.modal-body{padding:22px 26px}.modal-footer{display:flex;justify-content:flex-end;gap:8px;padding:16px 26px;border-top:1px solid var(--line);background:#fcfdfb}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:flex;flex-direction:column;gap:5px;min-width:0}.field.span2{grid-column:span 2}.field label{font-size:11px;color:#536a59;font-weight:700}.field input,.field select,.field textarea{padding:10px 11px;border:1px solid #dce5db;border-radius:9px;background:#fff;width:100%;min-width:0;color:var(--ink)}.field textarea{min-height:85px;resize:vertical}.hint{color:#889589;font-size:10px}.field-set{margin-top:21px}.field-set h4{margin:0 0 11px;font-size:13px}.ingredient-rows{display:grid;gap:8px}.ingredient-row{display:grid;grid-template-columns:1fr 105px 31px;gap:8px;align-items:center}.ingredient-row select,.ingredient-row input{border:1px solid #dce5db;border-radius:8px;padding:9px;width:100%;min-width:0}.ingredient-row button{border:1px solid #eddfdc;background:#fff3f0;border-radius:8px;height:35px;color:#a44e44}.menu-check{display:grid;grid-template-columns:20px 1fr 110px;gap:9px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}.menu-check input[type=number]{width:95px;border:1px solid #dce5db;border-radius:7px;padding:7px}.totals-block{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:16px 0}.totals-block>div{background:#f4f7f3;border-radius:11px;padding:13px}.totals-block .big{font-size:21px;font-weight:750}.align-right{text-align:right}.inline-note{font-size:11px;color:var(--muted);margin-top:10px}.details-line{padding:11px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}.details-line:last-child{border:0}.details-line strong{font-size:12px}.switches{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.switch{background:#f3f6f2;border:1px solid #e1e8df;padding:7px 12px;border-radius:9px;color:#456751}.switch.active{color:#fff;background:#294e39;border-color:#294e39}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.settings-grid .panel{min-height:220px}.settings-grid p{color:var(--muted);font-size:12px}.toast{position:fixed;bottom:20px;right:20px;z-index:160;background:#142824;color:white;padding:12px 18px;border-radius:11px;box-shadow:0 15px 40px #152a2440;max-width:min(90vw,390px)}.printonly{display:none}.separator{height:1px;background:var(--line);margin:16px 0}.footnote{color:#879389;font-size:11px;margin-top:19px}.tiny{font-size:11px}.chart-row{display:grid;grid-template-columns:110px 1fr 80px;align-items:center;gap:12px;margin:15px 0}.chart-name{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chart-value{text-align:right;font-size:11px;font-weight:800}.demo-banner{color:#7c6139;background:#fcf2e3;border:1px solid #eadaba;border-radius:10px;padding:10px 13px;margin-bottom:18px;font-size:11px;display:flex;justify-content:space-between;align-items:center;gap:10px}.demo-banner button{border:0;background:none;text-decoration:underline;color:#866039;font-weight:700}
    @media(max-width:1100px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.cards-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.two-col{grid-template-columns:1fr}}
    @media(max-width:740px){.shell{display:block}.sidebar{position:sticky;z-index:30;top:0;height:auto;width:100%;padding:13px 12px 7px;gap:5px}.brand{padding:0 6px 7px;display:flex;justify-content:space-between;align-items:center}.mark{font-size:23px}.brand-sub{font-size:8px;margin:0}.nav-label,.aside-footer{display:none}.nav{display:flex;overflow:auto;padding:2px 0 6px;gap:3px;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav button{white-space:nowrap;width:auto;padding:8px 10px;font-size:11px;flex-shrink:0}.nav .emoji{font-size:14px;width:17px}.content{padding:24px 14px 50px}.top{margin-bottom:20px;flex-direction:column}.top .actions{width:100%}.title{font-size:32px}.metric{padding:16px}.metric .val{font-size:22px}.hero{padding:23px}.hero-row{align-items:flex-start;flex-direction:column}.hero h2{font-size:29px}.cards-grid{grid-template-columns:1fr}.modal-body,.modal-head,.modal-footer{padding-left:16px;padding-right:16px}.fields{grid-template-columns:1fr}.field.span2{grid-column:span 1}.settings-grid{grid-template-columns:1fr}.totals-block .big{font-size:16px}.content .panel{padding:16px}}
    @media(max-width:400px){.metrics{gap:8px}.metric .val{font-size:20px}.nav button{font-size:10px;gap:5px}.ingredient-row{grid-template-columns:1fr 80px 28px}.menu-check{grid-template-columns:18px 1fr 69px}.menu-check input[type=number]{width:64px}}
    @media print{body{background:#fff}.sidebar,.top,.no-print,.modal-layer,.toast,.demo-banner{display:none!important}.content{padding:0;max-width:100%}.printonly{display:block}.card{box-shadow:none}.print-report{font-family:Georgia,serif;padding:35px}.print-report h1{font-size:32px}.print-report table{min-width:0}.print-report th,.print-report td{padding:10px}.print-report .break{page-break-before:always}}

<body>
<div id="app"></div>
<script>
(() => {
  'use strict';
  const STORE='mise-private-chef-v1';
  const uuid=()=> (globalThis.crypto?.randomUUID?.() || 'id_'+Date.now()+'_'+Math.random().toString(36).slice(2));
  const dateISO=(plus=0)=>{const d=new Date();d.setDate(d.getDate()+plus);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
  const money=(n)=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:2}).format(Number(n)||0);
  const num=(n,d=2)=>new Intl.NumberFormat('es-ES',{maximumFractionDigits:d}).format(Number(n)||0);
  const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const E=(id)=>document.getElementById(id);
  const defaultData=()=>({version:1,brand:'MISE',demo:false,ingredients:[],recipes:[],menus:[],events:[],purchases:[]});
  const demoData=()=>{
    const d=defaultData(); d.demo=true;
    const items=[['Calabaza','Verduras','g',1000,2.4,18,1200,'Mercado local'],['Nata para cocinar','Lácteos','ml',1000,4.2,0,300,'Distribuidor'],['Pollo deshuesado','Carnes','g',1000,10.8,6,400,'Carnicería'],['Setas variadas','Verduras','g',500,6.75,10,0,'Mercado local'],['Harina','Despensa','g',1000,1.7,0,900,'Supermercado'],['Mantequilla','Lácteos','g',250,2.8,0,200,'Supermercado'],['Limón','Fruta','ud',6,2.7,14,3,'Mercado local'],['Huevos','Huevos','ud',12,3.3,0,6,'Mercado local']];
    d.ingredients=items.map(v=>({id:uuid(),name:v[0],category:v[1],unit:v[2],packQty:v[3],packPrice:v[4],waste:v[5],stockQty:v[6],supplier:v[7],allergens:''}));
    const find=(name)=>d.ingredients.find(i=>i.name===name).id;
    d.recipes=[
      {id:uuid(),name:'Crema suave de calabaza',category:'Entrante',portions:4,minutes:35,notes:'Ejemplo de receta. Sustituye las cantidades por las reales.',allergens:'Lácteos',lines:[{ingredientId:find('Calabaza'),qty:700},{ingredientId:find('Nata para cocinar'),qty:180},{ingredientId:find('Mantequilla'),qty:30}]},
      {id:uuid(),name:'Pollo rustido con setas',category:'Principal',portions:4,minutes:95,notes:'Costes orientativos de demostración.',allergens:'',lines:[{ingredientId:find('Pollo deshuesado'),qty:700},{ingredientId:find('Setas variadas'),qty:350},{ingredientId:find('Mantequilla'),qty:40}]},
      {id:uuid(),name:'Tarta de limón',category:'Postre',portions:8,minutes:90,notes:'Escandallo ilustrativo; no utilizar como receta técnica.',allergens:'Gluten, Huevos, Lácteos',lines:[{ingredientId:find('Limón'),qty:3},{ingredientId:find('Harina'),qty:280},{ingredientId:find('Huevos'),qty:3},{ingredientId:find('Mantequilla'),qty:150}]}
    ];
    d.menus=[{id:uuid(),name:'Menú degustación · Ejemplo',description:'Entrante, principal y postre; menú ficticio.',lines:d.recipes.map(r=>({recipeId:r.id,servings:1}))}];
    d.events=[{id:uuid(),client:'Cliente de demostración',date:dateISO(12),location:'Barcelona',guests:10,menuId:d.menus[0].id,pricePerGuest:95,extraIncome:0,staffCost:125,travelCost:35,rentalCost:20,otherCost:18,targetMargin:35,status:'confirmed',notes:'Ejemplo ficticio. Revisa todos los datos antes de presupuestar.'}];
    return d;
  };
  let db=load(); let current='dashboard', modal=null, detailEventId=null, filterText='', shoppingEvent='all', printedId=null, toastTimer;
  function load(){try{const raw=localStorage.getItem(STORE);if(!raw)return demoData();const x=JSON.parse(raw);if(!x||!Array.isArray(x.ingredients)||!Array.isArray(x.recipes)||!Array.isArray(x.menus)||!Array.isArray(x.events)||!Array.isArray(x.purchases))throw Error('bad data');return x;}catch(e){return demoData();}}
  function save(){try{localStorage.setItem(STORE,JSON.stringify(db));return true}catch(e){notice('No se pudo guardar en este navegador. Exporta una copia de seguridad.');return false;}}
  function notice(s){const t=E('toast');if(!t)return;t.textContent=s;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,3700)}
  const ing=(id)=>db.ingredients.find(x=>x.id===id);
  const recipe=(id)=>db.recipes.find(x=>x.id===id);
  const menu=(id)=>db.menus.find(x=>x.id===id);
  const event=(id)=>db.events.find(x=>x.id===id);
  const packUnitPrice=i=>(Number(i.packPrice)||0)/Math.max(0.00001,Number(i.packQty)||1);
  const useablePrice=i=>packUnitPrice(i)/(1-Math.min(.95,Math.max(0,Number(i.waste)||0)/100));
  const visibleUnit=i=>i.unit==='g'?[1000,'kg']:i.unit==='ml'?[1000,'L']:[1,'ud'];
  const unitCost=(price,i)=>{const [scale,unit]=visibleUnit(i);return `${money(price*scale)} / ${unit}`};
  function recipeCost(r){return (r?.lines||[]).reduce((s,l)=>{const i=ing(l.ingredientId);return s+(i?useablePrice(i)*(Number(l.qty)||0):0)},0)}
  function recipeUnit(r){return recipeCost(r)/Math.max(1,Number(r?.portions)||1)}
  function menuUnit(m){return (m?.lines||[]).reduce((s,l)=>{const r=recipe(l.recipeId);return s+(r?recipeUnit(r)*(Number(l.servings)||0):0)},0)}
  function menuIngredientQty(m,people=1){const map={};(m?.lines||[]).forEach(l=>{const r=recipe(l.recipeId);if(!r)return;const multiplier=people*(Number(l.servings)||0)/Math.max(1,Number(r.portions)||1);(r.lines||[]).forEach(z=>{const i=ing(z.ingredientId);if(!i)return;map[i.id]=(map[i.id]||0)+Number(z.qty||0)*multiplier;});});return map}
  function eventStats(e){const m=menu(e.menuId),revenue=(Number(e.pricePerGuest)||0)*Number(e.guests||0)+(Number(e.extraIncome)||0);const food=(m?menuUnit(m):0)*Number(e.guests||0);const other=['staffCost','travelCost','rentalCost','otherCost'].reduce((s,k)=>s+(Number(e[k])||0),0);const cost=food+other;return {revenue,food,other,cost,profit:revenue-cost,margin:revenue>0?(revenue-cost)/revenue*100:0,foodRate:revenue>0?food/revenue*100:0}}
  function options(arr,chosen,captionKey='name'){return arr.map(x=>`<option value="${esc(x.id)}" ${chosen===x.id?'selected':''}>${esc(x[captionKey])}</option>`).join('')}
  function eventTag(status){const cfg={draft:['Borrador','draft'],confirmed:['Confirmado',''],completed:['Realizado','done'],cancelled:['Cancelado','warn']};const v=cfg[status]||cfg.draft;return `<span class="pill ${v[1]}">${v[0]}</span>`}
  const icon={dashboard:'◫',ingredients:'◈',recipes:'♧',menus:'▤',events:'▣',shopping:'✓',purchases:'⇅',settings:'⚙'};
  const nav=[['dashboard','Resumen'],['ingredients','Ingredientes'],['recipes','Recetario'],['menus','Menús'],['events','Eventos'],['shopping','Lista de compra'],['purchases','Precios / compras'],['settings','Configuración']];
  const heading=(title,kicker,subtitle='',buttons='')=>`<div class="top"><div><div class="kicker">${kicker}</div><h1 class="title">${title}</h1>${subtitle?`<div class="sub">${subtitle}</div>`:''}</div><div class="actions">${buttons}</div></div>`;
  const makeButton=(title,action,extra='',klass='')=>`<button class="btn ${klass}" data-act="${action}" ${extra}>${title}</button>`;
  const empty=(title,desc,action)=>`<div class="empty"><div class="big-icon">♧</div><strong>${title}</strong><div>${desc}</div>${action?`<div style="margin-top:16px">${action}</div>`:''}</div>`;
  function globalDataSummary(){const arr=db.events.filter(e=>['confirmed','completed'].includes(e.status));const s=arr.reduce((a,e)=>{const c=eventStats(e);a.revenue+=c.revenue;a.profit+=c.profit;a.food+=c.food;a.cost+=c.cost;return a},{revenue:0,profit:0,food:0,cost:0});return {...s,events:arr.length,margin:s.revenue?s.profit/s.revenue*100:0}}
  function dashboard(){const k=globalDataSummary(), upcoming=db.events.filter(x=>x.date>=dateISO(0)&&x.status!=='cancelled').sort((a,b)=>a.date.localeCompare(b.date)).slice(0,4), events=db.events.filter(x=>x.status!=='cancelled').slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);let max=Math.max(...events.map(e=>eventStats(e).revenue),1);const purchaseAlerts=db.purchases.filter(p=>typeof p.previousPerBase==='number' && p.previousPerBase>0).slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4);

    <section class="hero card"><div class="hero-row"><div><div class="eyebrow" style="color:#a4c3ad">PRIVATE CHEF CONTROL</div><h2>Crea experiencias.<br>Controla cada margen.</h2><p>Diseña un menú, escala las cantidades por comensal y conoce lo que vas a ganar antes de aceptar el evento.</p></div><button data-act="new-recipe">＋ Añadir primera receta</button></div></section>

  function ingredients(){const arr=db.ingredients.filter(i=>!filterText||[i.name,i.category,i.supplier].join(' ').toLowerCase().includes(filterText.toLowerCase())).sort((a,b)=>a.name.localeCompare(b.name));return `${heading('Ingredientes y productos','CATÁLOGO DE MATERIAS PRIMAS','Los precios se actualizan en todos los escandallos de forma automática.',makeButton('＋ Nuevo ingrediente','new-ingredient'))}${db.demo?`<div class="demo-banner"><span>Precios ficticios de demostración. Sustitúyelos por tus proveedores reales.</span><button data-act="clear-demo">Vaciar demo</button></div>`:''}<div class="view-tools"><input class="search" data-filter placeholder="Buscar ingrediente o proveedor…" value="${esc(filterText)}"/><span class="pill">${arr.length} productos</span></div>${arr.length?`<div class="table-wrap"><table><thead><tr><th>Producto</th><th>Presentación</th><th>Precio envase</th><th>Merma</th><th>Coste útil / kg, L o ud</th><th>Stock bruto</th><th></th></tr></thead><tbody>${arr.map(i=>`<tr><td><span class="table-title">${esc(i.name)}</span><span class="table-muted">${esc(i.category||'Sin categoría')} · ${esc(i.supplier||'Sin proveedor')}</span></td><td>${num(i.packQty)} ${esc(i.unit)}</td><td>${money(i.packPrice)}</td><td>${num(i.waste,1)}%</td><td class="emphasis">${unitCost(useablePrice(i),i)}</td><td>${num(i.stockQty)} ${esc(i.unit)}</td><td class="table-actions"><button class="link" data-act="edit-ingredient" data-id="${i.id}">Editar</button><button class="link dangerlink" data-act="delete-ingredient" data-id="${i.id}">Eliminar</button></td></tr>`).join('')}</tbody></table></div>`:empty('Sin ingredientes','Añade productos, cantidades y precios de compra.',makeButton('Añadir ingrediente','new-ingredient'))}<p class="footnote">Define los gramos, mililitros o unidades útiles empleados en cada receta. La merma convierte estos consumos en cantidades brutas a comprar. Los importes se expresan sin IVA, de forma consistente.</p>`}
  function recipes(){const arr=db.recipes.filter(r=>!filterText||[r.name,r.category,r.notes].join(' ').toLowerCase().includes(filterText.toLowerCase())).sort((a,b)=>a.name.localeCompare(b.name));return `${heading('Tu recetario','BIBLIOTECA CULINARIA','Escandallos vivos: al cambiar el precio de un ingrediente, cambian los costes de los platos.',makeButton('＋ Nueva receta','new-recipe'))}<div class="view-tools"><input class="search" data-filter placeholder="Buscar plato, categoría…" value="${esc(filterText)}"/><span class="pill">${arr.length} recetas</span></div>${arr.length?`<div class="cards-grid">${arr.map(r=>`<article class="card item-card"><div><span class="tag">${esc(r.category||'Receta')}</span><h3>${esc(r.name)}</h3><p>${num(r.portions,0)} raciones · ${num(r.minutes,0)} min · ${(r.lines||[]).length} ingredientes</p></div><div class="recipe-lines"><span class="secondary">${(r.lines||[]).slice(0,3).map(l=>esc(ing(l.ingredientId)?.name||'Ingrediente eliminado')).join(' · ')||'Sin ingredientes'}</span></div><div class="bottom"><div><span class="secondary">Coste por ración</span><br><strong>${money(recipeUnit(r))}</strong></div><div class="links"><button class="link" data-act="edit-recipe" data-id="${r.id}">Editar</button><button class="link dangerlink" data-act="delete-recipe" data-id="${r.id}">Eliminar</button></div></div></article>`).join('')}</div>`:empty('Tu recetario está vacío','Crea platos y asigna productos para calcular su coste.',makeButton('Crear receta','new-recipe'))}`}
  function menus(){return `${heading('Menús y experiencias','DISEÑO DE MENÚS','Agrupa tus elaboraciones y calcula el coste de materia prima por persona.',makeButton('＋ Nuevo menú','new-menu'))}<div class="cards-grid">${db.menus.length?db.menus.map(m=>`<article class="card item-card"><div><span class="tag">MENÚ</span><h3>${esc(m.name)}</h3><p>${esc(m.description||'')}</p></div><div class="recipe-lines">${(m.lines||[]).map(l=>`<span class="chip">${esc(recipe(l.recipeId)?.name||'Receta eliminada')} ×${num(l.servings)}</span>`).join('')}</div><div class="bottom"><div><span class="secondary">Coste por comensal</span><br><strong>${money(menuUnit(m))}</strong></div><div class="links"><button class="link" data-act="edit-menu" data-id="${m.id}">Editar</button><button class="link dangerlink" data-act="delete-menu" data-id="${m.id}">Eliminar</button></div></div></article>`).join(''):empty('Sin menús','Añade platos a un menú y calcula su coste.',makeButton('Crear menú','new-menu'))}</div><p class="footnote">Cada plato tiene un multiplicador de raciones por comensal. Por ejemplo, «0,5» equivale a media ración de esa receta por persona.</p>`}
  function events(){const arr=db.events.filter(e=>!filterText||[e.client,e.location,menu(e.menuId)?.name].join(' ').toLowerCase().includes(filterText.toLowerCase())).sort((a,b)=>b.date.localeCompare(a.date));return `${heading('Servicios y eventos','GESTIÓN DE CLIENTES','Presupuesta, planifica y registra la rentabilidad estimada de cada experiencia.',makeButton('＋ Nuevo evento','new-event'))}<div class="view-tools"><input class="search" data-filter placeholder="Buscar cliente, lugar, menú…" value="${esc(filterText)}"/><span class="pill">${arr.length} eventos</span></div>${arr.length?`<div class="cards-grid">${arr.map(e=>{const s=eventStats(e);return `<article class="card event-card"><div class="event-top"><span class="event-date">${fmtDate(e.date)}</span>${eventTag(e.status)}</div><h3>${esc(e.client)}</h3><div class="meta">${esc(e.location||'Ubicación sin definir')} · ${num(e.guests,0)} personas</div><div class="secondary">${esc(menu(e.menuId)?.name||'Sin menú asignado')}</div><div class="totals"><div><span class="secondary">Ingreso</span><br><strong>${money(s.revenue)}</strong></div><div class="align-right"><span class="secondary">Beneficio / margen</span><br><strong class="${s.profit<0?'negative':''}">${money(s.profit)} <span class="secondary">(${num(s.margin,0)}%)</span></strong></div></div><button class="btn light sm" data-act="view-event" data-id="${e.id}">Ver presupuesto y costes</button></article>`}).join('')}</div>`:empty('No hay eventos','Añade el primer evento, elige menú y fija precio por persona.',makeButton('Crear evento','new-event'))}`}
  function shopping(){let ev=db.events.filter(e=>e.status!=='cancelled').sort((a,b)=>a.date.localeCompare(b.date));if(shoppingEvent!=='all'&&!ev.some(e=>e.id===shoppingEvent))shoppingEvent='all';let qty={};const chosen=shoppingEvent==='all'?ev.filter(e=>['confirmed','completed'].includes(e.status)&&e.date>=dateISO(-1)):ev.filter(e=>e.id===shoppingEvent);chosen.forEach(e=>{const sub=menuIngredientQty(menu(e.menuId),Number(e.guests)||0);Object.entries(sub).forEach(([id,q])=>{qty[id]=(qty[id]||0)+q})});let rows=Object.entries(qty).map(([id,net])=>{const i=ing(id);if(!i)return null;const gross=net/(1-(Number(i.waste)||0)/100),needed=Math.max(0,gross-(Number(i.stockQty)||0)),packs=Math.ceil(needed/Math.max(0.0001,Number(i.packQty)||1)),cost=packs*(Number(i.packPrice)||0);return {i,net,gross,needed,packs,cost}}).filter(Boolean).sort((a,b)=>(a.i.supplier||'').localeCompare(b.i.supplier||''));let total=rows.reduce((s,r)=>s+r.cost,0);
    return `${heading('Lista de compra','PLANIFICACIÓN DE PRODUCCIÓN','Agrupación automática de ingredientes de las recetas asignadas a los eventos.',makeButton('↓ Exportar CSV','export-shopping'))}<div class="panel card" style="margin-bottom:17px"><div class="field"><label for="choose-shopping">Evento</label><select id="choose-shopping"><option value="all">Todos los eventos futuros confirmados</option>${ev.map(e=>`<option value="${e.id}" ${e.id===shoppingEvent?'selected':''}>${esc(e.client)} · ${fmtDate(e.date)} · ${num(e.guests,0)} personas</option>`).join('')}</select></div><div class="totals-block"><div><div class="secondary">Ingredientes</div><div class="big">${rows.length}</div></div><div><div class="secondary">Envases necesarios</div><div class="big">${rows.reduce((s,r)=>s+r.packs,0)}</div></div><div><div class="secondary">Compra estimada</div><div class="big">${money(total)}</div></div></div><p class="inline-note">Compra estimada por envases completos, descontando el stock introducido. No representa exactamente el coste consumido en el escandallo.</p></div>${rows.length?`<div class="table-wrap"><table><thead><tr><th>Ingrediente</th><th>Necesidad neta</th><th>Compra bruta</th><th>Stock</th><th>A comprar</th><th>Envases / coste</th></tr></thead><tbody>${rows.map(r=>`<tr><td><span class="table-title">${esc(r.i.name)}</span><span class="table-muted">${esc(r.i.supplier||'Proveedor sin indicar')}</span></td><td>${num(r.net,1)} ${esc(r.i.unit)}</td><td>${num(r.gross,1)} ${esc(r.i.unit)}</td><td>${num(r.i.stockQty)} ${esc(r.i.unit)}</td><td class="emphasis">${num(r.needed,1)} ${esc(r.i.unit)}</td><td>${r.packs} × ${money(r.i.packPrice)}<span class="table-muted">${money(r.cost)}</span></td></tr>`).join('')}</tbody></table></div>`:empty('No hay compras calculadas','Selecciona un evento que tenga menú y recetas con ingredientes.')}<p class="footnote">El cálculo supone las mismas necesidades por comensal y no incorpora rendimientos adicionales de cocción ni compras mínimas del proveedor. Las cantidades se deben validar antes de cursar pedidos.</p>`}
  function purchases(){const sorted=db.purchases.slice().sort((a,b)=>b.date.localeCompare(a.date)||Number(b.createdAt||0)-Number(a.createdAt||0));return `${heading('Compras y precios','SEGUIMIENTO DE PROVEEDORES','Registra cada nueva compra para actualizar los escandallos y detectar variaciones.',makeButton('＋ Registrar compra','new-purchase'))}${sorted.length?`<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Ingrediente / proveedor</th><th>Referencia</th><th>Precio formato</th><th>Precio / kg, L o ud bruto</th><th>Variación</th><th></th></tr></thead><tbody>${sorted.map(p=>{const i=ing(p.ingredientId),c=p.previousPerBase>0?(p.packPrice/p.packQty-p.previousPerBase)/p.previousPerBase*100:null;return `<tr><td>${fmtDate(p.date)}</td><td><span class="table-title">${esc(i?.name||'Eliminado')}</span><span class="table-muted">${esc(p.supplier||'Sin proveedor')}</span></td><td>${esc(p.reference||'—')}</td><td>${num(p.packQty)} ${esc(i?.unit||'ud')} · ${money(p.packPrice)}</td><td>${i?unitCost(p.packPrice/p.packQty,i):money(p.packPrice/p.packQty)}</td><td class="${c>0?'negative':'positive'}">${c===null?'—':`${c>0?'+':''}${num(c,1)}%`}</td><td><button class="link dangerlink" data-act="delete-purchase" data-id="${p.id}">Eliminar</button></td></tr>`}).join('')}</tbody></table></div>`:empty('No hay compras registradas','Registra el último precio de compra de tus ingredientes.',makeButton('Añadir compra','new-purchase'))}<p class="footnote">Registrar una compra actualiza el precio y formato del ingrediente. Borrar una compra no restaura automáticamente precios anteriores; puedes editar el ingrediente directamente. Este módulo no emite facturas fiscales.</p>`}
  function settings(){return `${heading('Configuración y datos','TU ENTORNO PRIVADO','Tus datos se guardan localmente en este navegador. Haz copias de seguridad periódicas.')}

  function fmtDate(s){if(!s)return 'Sin fecha';const parts=String(s).split('-').map(Number);if(parts.length!==3||parts.some(x=>!x))return esc(s);return new Intl.DateTimeFormat('es-ES',{day:'2-digit',month:'short',year:'numeric'}).format(new Date(parts[0],parts[1]-1,parts[2]))}
  function render(){const body={dashboard,ingredients,recipes,menus,events,shopping,purchases,settings}[current]();E('app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><div class="mark">MISE<span style="color:#a7cba7">.</span></div><div class="brand-sub">PRIVATE CHEF OS</div></div><div class="nav-label">ESPACIO DE TRABAJO</div><nav class="nav">${nav.map(([id,title])=>`<button data-nav="${id}" class="${current===id?'active':''}"><span class="emoji">${icon[id]}</span>${title}</button>`).join('')}</nav><div class="aside-footer"><strong>Una cocina. Todos los números.</strong>Edición privada · Local · Sin suscripción</div></aside><main><div class="content">${body}</div></main></div><div id="modal-root"></div><div class="toast" id="toast" hidden></div>`;if(modal)renderModal();if(detailEventId)renderDetail();}

    if(type==='ingredient')html=modalChrome(id?'Editar ingrediente':'Nuevo ingrediente','Precio y formatos expresados sin IVA.',`<div class="fields">${field('name','Nombre del producto *',x.name||'','text','required maxlength="100"','span2')}${field('category','Categoría',x.category||'')}${field('supplier','Proveedor',x.supplier||'')}${selectField('unit','Unidad base', [['g','Gramos (g)'],['ml','Mililitros (ml)'],['ud','Unidades (ud)']],x.unit||'g')}${field('packQty','Cantidad por envase *',x.packQty??1000,'number','required min="0.001" step="0.001"')}${field('packPrice','Precio sin IVA por envase (€) *',x.packPrice??0,'number','required min="0" step="0.01"')}${field('waste','Merma (%)',x.waste??0,'number','min="0" max="95" step="0.1"')}${field('stockQty','Stock bruto disponible (unidad base)',x.stockQty??0,'number','min="0" step="0.01"')}${field('allergens','Alérgenos conocidos (registro manual)',x.allergens||'','text','placeholder="Ej. Leche, gluten"','span2')}</div><p class="inline-note">Si compras un formato de 500 g por 5 €, indica cantidad 500 y precio 5. Las cantidades de las recetas se interpretan como producto útil/neto.</p>`);
    if(type==='recipe')html=modalChrome(id?'Editar receta':'Nueva receta','Las cantidades se corresponden con el rendimiento total del plato.',`<div class="fields">${field('name','Nombre del plato *',x.name||'','text','required maxlength="120"','span2')}${selectField('category','Tipo de plato',[['Aperitivo','Aperitivo'],['Entrante','Entrante'],['Principal','Principal'],['Postre','Postre'],['Preparación','Preparación / base'],['Otros','Otros']],x.category||'Entrante')}${field('portions','Raciones producidas *',x.portions??4,'number','required min="0.1" step="0.1"')}${field('minutes','Tiempo de elaboración (min)',x.minutes??0,'number','min="0" step="1"')}${field('allergens','Alérgenos (revisión manual)',x.allergens||'')}${textArea('notes','Notas de cocina',x.notes||'')}</div><div class="field-set"><h4>Ingredientes del escandallo <span class="secondary">· cantidades útiles/netas para todas las raciones</span></h4><div class="ingredient-rows" id="recipe-lines"></div><button type="button" class="btn light sm" data-act="add-recipe-line" style="margin-top:11px">＋ Añadir ingrediente</button></div>`,true);
    if(type==='menu')html=modalChrome(id?'Editar menú':'Nuevo menú','Configura las recetas incluidas por comensal.',`<div class="fields">${field('name','Nombre del menú *',x.name||'','text','required maxlength="130"','span2')}${textArea('description','Descripción',x.description||'')}</div><div class="field-set"><h4>Selecciona platos y raciones por comensal</h4>${db.recipes.length?db.recipes.map(r=>{const l=(x.lines||[]).find(y=>y.recipeId===r.id);return `<label class="menu-check"><input type="checkbox" name="m-${r.id}" ${l?'checked':''}><span>${esc(r.name)} <span class="secondary">· ${money(recipeUnit(r))} / ración</span></span><input type="number" name="q-${r.id}" value="${l?.servings??1}" min="0.01" step="0.01" aria-label="Raciones de ${esc(r.name)}"></label>`}).join(''):empty('Necesitas recetas','Crea primero una receta y sus ingredientes.')}</div>`,true);
    if(type==='event')html=modalChrome(id?'Editar evento':'Nuevo evento','Introduce tus precios y costes sin IVA y de forma consistente.',`<div class="fields">${field('client','Cliente / nombre del evento *',x.client||'','text','required maxlength="120"','span2')}${field('date','Fecha *',x.date||dateISO(7),'date','required')}${field('location','Lugar',x.location||'')}${field('guests','Nº comensales *',x.guests??10,'number','required min="1" step="1"')}${selectField('menuId','Menú asignado',[['','Sin menú'],...db.menus.map(m=>[m.id,m.name])],x.menuId||'')}${field('pricePerGuest','Precio por comensal (€)',x.pricePerGuest??95,'number','min="0" step="0.01"')}${field('extraIncome','Ingresos adicionales (€)',x.extraIncome??0,'number','min="0" step="0.01"')}${field('staffCost','Personal (€)',x.staffCost??0,'number','min="0" step="0.01"')}${field('travelCost','Transporte (€)',x.travelCost??0,'number','min="0" step="0.01"')}${field('rentalCost','Alquiler / material (€)',x.rentalCost??0,'number','min="0" step="0.01"')}${field('otherCost','Otros costes (incluye tu tiempo) (€)',x.otherCost??0,'number','min="0" step="0.01"')}${field('targetMargin','Margen objetivo (%)',x.targetMargin??35,'number','min="0" max="90" step="1"')}${selectField('status','Estado',[['draft','Borrador'],['confirmed','Confirmado'],['completed','Realizado'],['cancelled','Cancelado']],x.status||'draft')}${textArea('notes','Notas / alergias / restricciones del servicio',x.notes||'')}</div><p class="inline-note">Para no sobreestimar el beneficio, incluye desplazamientos, ayuda, alquiler de material y el coste de tus horas de trabajo. El escandallo de los platos se suma automáticamente.</p>`,true);
    if(type==='purchase')html=modalChrome('Registrar compra','Actualiza el precio del ingrediente y registra su variación.',`<div class="fields">${selectField('ingredientId','Ingrediente *',db.ingredients.map(i=>[i.id,i.name]),'','span2')}${field('date','Fecha',dateISO(),'date','required')}${field('reference','Referencia factura / ticket','','text','maxlength="70"')}${field('packQty','Cantidad del envase *',1000,'number','required min="0.001" step="0.001"')}${field('packPrice','Coste del envase sin IVA (€) *',0,'number','required min="0" step="0.01"')}${field('supplier','Proveedor','','text','maxlength="100"','span2')}</div><p class="inline-note">Puedes transcribir aquí el precio de una factura. La lectura automática de PDF/fotos aún no está disponible.</p>`);
    E('modal-root').innerHTML=html;
    if(type==='recipe'){const root=E('recipe-lines');const lines=(x.lines?.length?x.lines:[{ingredientId:db.ingredients[0]?.id||'',qty:0}]);lines.forEach(l=>addRecipeLine(l));}
  }
  function addRecipeLine(l={}){const root=E('recipe-lines');if(!root)return;if(!db.ingredients.length){root.innerHTML='<div class="secondary">Añade ingredientes primero para crear el escandallo.</div>';return;}const row=document.createElement('div');row.className='ingredient-row';row.innerHTML=`<select class="ri" aria-label="Ingrediente"><option value="">Elegir ingrediente</option>${options(db.ingredients,l.ingredientId)}</select><input class="rq" aria-label="Cantidad neta" type="number" min="0.001" step="0.001" value="${esc(l.qty??0)}" placeholder="Cantidad"><button type="button" data-act="remove-line" aria-label="Eliminar línea">×</button>`;root.appendChild(row)}
  function renderDetail(){const e=event(detailEventId);if(!e){detailEventId=null;return;}const s=eventStats(e),m=menu(e.menuId),recommendedPP=Math.max(0,(s.cost/(1-Math.min(90,Math.max(0,Number(e.targetMargin??35)))/100)-Number(e.extraIncome||0))/Math.max(1,Number(e.guests||1))),items=(m?.lines||[]).map(l=>{const r=recipe(l.recipeId);return r?`<div class="details-line"><div><strong>${esc(r.name)}</strong><div class="secondary">${num(l.servings)} ración(es) / persona</div></div><strong>${money(recipeUnit(r)*Number(l.servings)*Number(e.guests))}</strong></div>`:''}).join('');E('modal-root').innerHTML=`<div class="modal-layer" id="layer"><div class="modal wide" role="dialog" aria-modal="true" aria-label="Detalle del evento"><div class="modal-head"><div><span class="tag">${fmtDate(e.date)}</span><h2>${esc(e.client)}</h2><div class="sub">${esc(e.location||'Sin lugar')} · ${num(e.guests,0)} comensales · ${esc(m?.name||'Sin menú')}</div></div><button class="close" data-act="close-detail" aria-label="Cerrar">×</button></div><div class="modal-body"><div class="actions">${eventTag(e.status)}<span class="secondary">Presupuesto interno de rentabilidad</span></div><div class="totals-block"><div><div class="secondary">Ingreso estimado</div><div class="big">${money(s.revenue)}</div></div><div><div class="secondary">Costes totales</div><div class="big">${money(s.cost)}</div></div><div><div class="secondary">Beneficio / margen</div><div class="big ${s.profit<0?'negative':'positive'}">${money(s.profit)}</div><div class="secondary">${num(s.margin,1)}%</div></div></div>${!m?.lines?.length?'<div class="notice warning">Este evento no tiene un menú completo: el coste de la comida puede estar infravalorado.</div>':''}<div class="notice">Para alcanzar un margen objetivo de <strong>${num(e.targetMargin??35,0)}%</strong>, el precio sugerido es <strong>${money(recommendedPP)} por comensal</strong> (antes de impuestos, según los costes indicados).</div><div class="two-col"><div><h3>Menú y escandallos</h3>${items||'<div class="secondary">No has seleccionado un menú.</div>'}<div class="details-line"><strong>Materia prima total</strong><strong>${money(s.food)}</strong></div></div><div><h3>Detalle económico</h3><div class="details-line"><span>Precio por comensal</span><strong>${money(e.pricePerGuest)}</strong></div><div class="details-line"><span>Ingresos adicionales</span><strong>${money(e.extraIncome)}</strong></div><div class="details-line"><span>Personal</span><strong>${money(e.staffCost)}</strong></div><div class="details-line"><span>Transporte</span><strong>${money(e.travelCost)}</strong></div><div class="details-line"><span>Material</span><strong>${money(e.rentalCost)}</strong></div><div class="details-line"><span>Otros / tiempo propio</span><strong>${money(e.otherCost)}</strong></div></div></div>${e.notes?`<div class="separator"></div><h3>Notas</h3><p>${esc(e.notes)}</p>`:''}<p class="inline-note">No incluye IVA, IRPF, amortizaciones ni gastos fijos no asignados. Los alérgenos se deben comprobar manualmente para cada evento.</p></div><div class="modal-footer"><button class="btn light" data-act="edit-event" data-id="${e.id}">Editar evento</button><button class="btn light" data-act="shopping-this" data-id="${e.id}">Ver compras</button><button class="btn" data-act="print-event" data-id="${e.id}">Imprimir presupuesto interno</button></div></div></div>`}
  function fv(fd,k){return String(fd.get(k)||'').trim()}
  function nfv(fd,k,def=0){const v=Number(fd.get(k));return Number.isFinite(v)?v:def}
  function validNumber(v,min=0,max=1e10){return Number.isFinite(v)&&v>=min&&v<=max}
  function submitForm(f){if(!modal)return;const {type,id}=modal,fd=new FormData(f);let x,arr;
    if(type==='ingredient'){const name=fv(fd,'name'),packQty=nfv(fd,'packQty'),packPrice=nfv(fd,'packPrice'),waste=nfv(fd,'waste'),stock=nfv(fd,'stockQty');if(!name||!validNumber(packQty,.001)||!validNumber(packPrice)||!validNumber(waste,0,95)||!validNumber(stock)){notice('Revisa las cantidades y los precios.');return;}x={id:id||uuid(),name,category:fv(fd,'category'),supplier:fv(fd,'supplier'),unit:fv(fd,'unit'),packQty,packPrice,waste,stockQty:stock,allergens:fv(fd,'allergens')};arr=db.ingredients;}
    if(type==='recipe'){const name=fv(fd,'name'),portions=nfv(fd,'portions'),mins=nfv(fd,'minutes');if(!name||!validNumber(portions,.1)||!validNumber(mins)){notice('Nombre y raciones válidas son obligatorios.');return;}let lines=[...f.querySelectorAll('.ingredient-row')].map(r=>({ingredientId:r.querySelector('.ri').value,qty:Number(r.querySelector('.rq').value)})).filter(l=>l.ingredientId&&l.qty>0&&Number.isFinite(l.qty));if(!lines.length){notice('Introduce al menos un ingrediente y su cantidad.');return;}x={id:id||uuid(),name,category:fv(fd,'category'),portions,minutes:mins,allergens:fv(fd,'allergens'),notes:fv(fd,'notes'),lines};arr=db.recipes;}
    if(type==='menu'){const name=fv(fd,'name');if(!name){notice('El menú necesita un nombre.');return;}let lines=db.recipes.filter(r=>fd.get('m-'+r.id)).map(r=>({recipeId:r.id,servings:nfv(fd,'q-'+r.id,1)})).filter(l=>validNumber(l.servings,.01));if(!lines.length){notice('Selecciona al menos una receta.');return;}x={id:id||uuid(),name,description:fv(fd,'description'),lines};arr=db.menus;}
    if(type==='event'){const client=fv(fd,'client'),guests=nfv(fd,'guests');const ks=['pricePerGuest','extraIncome','staffCost','travelCost','rentalCost','otherCost'];if(!client||!fv(fd,'date')||!Number.isInteger(guests)||guests<1||ks.some(k=>!validNumber(nfv(fd,k)))){notice('Revisa cliente, fecha, número de personas e importes.');return;}x={id:id||uuid(),client,date:fv(fd,'date'),location:fv(fd,'location'),guests,menuId:fv(fd,'menuId'),status:fv(fd,'status'),notes:fv(fd,'notes'),targetMargin:nfv(fd,'targetMargin',35)};if(!validNumber(x.targetMargin,0,90)){notice('El margen objetivo debe estar entre 0 y 90%.');return;}ks.forEach(k=>x[k]=nfv(fd,k));arr=db.events;}
    if(type==='purchase'){const i=ing(fv(fd,'ingredientId')),pq=nfv(fd,'packQty'),pp=nfv(fd,'packPrice');if(!i||!validNumber(pq,.001)||!validNumber(pp)){notice('Selecciona un ingrediente y un formato/precio válido.');return;}x={id:uuid(),ingredientId:i.id,date:fv(fd,'date')||dateISO(),reference:fv(fd,'reference'),packQty:pq,packPrice:pp,supplier:fv(fd,'supplier')||i.supplier,previousPerBase:packUnitPrice(i),createdAt:Date.now()};i.packQty=pq;i.packPrice=pp;i.supplier=x.supplier;db.purchases.push(x);}
    else if(arr){const ix=arr.findIndex(o=>o.id===id);if(ix>=0)arr[ix]=x;else arr.push(x)}
    save();modal=null;filterText='';render();notice('Cambios guardados correctamente.');}
  function safeDelete(type,id){const cfg={ingredient:['ingredients','ingrediente'],recipe:['recipes','receta'],menu:['menus','menú'],event:['events','evento'],purchase:['purchases','registro de compra']};const [key,nm]=cfg[type];if(!confirm(`¿Eliminar este ${nm}? Esta acción no se puede deshacer.`))return;if(type==='ingredient'&&db.recipes.some(r=>(r.lines||[]).some(l=>l.ingredientId===id))){notice('Este ingrediente está en una receta. Quítalo de ella antes de borrarlo.');return}if(type==='recipe'&&db.menus.some(m=>(m.lines||[]).some(l=>l.recipeId===id))){notice('Esta receta está en un menú. Elimínala del menú primero.');return}if(type==='menu'&&db.events.some(e=>e.menuId===id)){notice('Este menú está asignado a eventos. Cámbialo en ellos primero.');return}db[key]=db[key].filter(x=>x.id!==id);save();render();notice('Registro eliminado.')}
  function download(filename,body,type){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([body],{type}));a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1200)}
  function csv(rows){return '\ufeff'+rows.map(r=>r.map(v=>{let t=String(v??'');if(/^[\s]*[=+@-]/.test(t))t="'"+t;return '"'+t.replaceAll('"','""')+'"'}).join(';')).join('\r\n')}
  function exportJSON(){download('MISE_copia_'+dateISO()+'.json',JSON.stringify(db,null,2),'application/json')}
  function exportEvents(){download('MISE_eventos_'+dateISO()+'.csv',csv([['Fecha','Cliente','Lugar','Comensales','Estado','Menú','Precio por persona','Facturación','Materia prima','Otros costes','Beneficio','Margen (%)'],...db.events.map(e=>{const s=eventStats(e);return [e.date,e.client,e.location,e.guests,e.status,menu(e.menuId)?.name||'',e.pricePerGuest,s.revenue,s.food,s.other,s.profit,s.margin]})]),'text/csv;charset=utf-8')}
  function exportShopping(){const select=shoppingEvent==='all'?db.events.filter(e=>['confirmed','completed'].includes(e.status)&&e.date>=dateISO(-1)):db.events.filter(e=>e.id===shoppingEvent);const needed={};select.forEach(e=>Object.entries(menuIngredientQty(menu(e.menuId),e.guests)).forEach(([id,q])=>needed[id]=(needed[id]||0)+q));const rows=Object.entries(needed).map(([id,net])=>{const i=ing(id);if(!i)return null;const gross=net/(1-i.waste/100),qty=Math.max(0,gross-i.stockQty),packs=Math.ceil(qty/i.packQty);return [i.name,i.supplier,i.unit,net,gross,i.stockQty,qty,packs,packs*i.packPrice]}).filter(Boolean);download('MISE_compras_'+dateISO()+'.csv',csv([['Ingrediente','Proveedor','Unidad','Neto necesario','Bruto necesario','Stock bruto','Bruto a comprar','Envases','Coste previsto (€)'],...rows]),'text/csv;charset=utf-8')}
  function printEvent(id){const e=event(id);if(!e)return;const s=eventStats(e),m=menu(e.menuId);let html=`<!doctype html><html lang="es"><head><meta charset="utf-8"><title>MISE · ${esc(e.client)}</title><style>body{font:15px/1.5 Arial;padding:35px;color:#1d2a20;max-width:850px;margin:auto}h1{font:40px Georgia;margin:5px 0}h2{font:22px Georgia;margin-top:30px}small{color:#68766b}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #dde5df}th{color:#5f7565}footer{font-size:11px;color:#7b857b;margin-top:40px}.total{font-size:24px;font-weight:700}@media print{body{padding:0}}</style></head><body><small>MISE · PRIVATE CHEF OS · DOCUMENTO INTERNO</small><h1>${esc(e.client)}</h1><p>${fmtDate(e.date)} · ${esc(e.location)} · ${num(e.guests,0)} comensales</p><h2>${esc(m?.name||'Sin menú')}</h2><table><tr><th>Plato</th><th>Raciones / persona</th><th>Coste total</th></tr>${(m?.lines||[]).map(l=>{const r=recipe(l.recipeId);return `<tr><td>${esc(r?.name||'—')}</td><td>${num(l.servings)}</td><td>${money((r?recipeUnit(r):0)*l.servings*e.guests)}</td></tr>`}).join('')}</table><h2>Resumen económico</h2><table><tr><td>Ingresos</td><td>${money(s.revenue)}</td></tr><tr><td>Materia prima</td><td>${money(s.food)}</td></tr><tr><td>Personal + logística + otros</td><td>${money(s.other)}</td></tr><tr><td>Costes totales</td><td>${money(s.cost)}</td></tr><tr><td><b>Beneficio estimado</b></td><td class="total">${money(s.profit)}</td></tr><tr><td>Margen previsto</td><td>${num(s.margin,1)}%</td></tr></table><footer>Presupuesto interno de costes: no es factura, presupuesto fiscal ni documento para enviar automáticamente a un cliente. Valores sin IVA y basados en los datos registrados. Generado ${new Date().toLocaleString('es-ES')}.</footer></body></html>`;const w=window.open('','_blank');if(!w){notice('Permite las ventanas emergentes para imprimir.');return;}w.document.write(html);w.document.close();w.focus();setTimeout(()=>w.print(),250)}
  document.addEventListener('click',ev=>{const navEl=ev.target.closest('[data-nav]');if(navEl){choose(navEl.dataset.nav);return}const b=ev.target.closest('[data-act]');if(!b){if(ev.target.id==='layer'){modal=null;detailEventId=null;E('modal-root').innerHTML=''}return;}const a=b.dataset.act,id=b.dataset.id;switch(a){
    case 'new-ingredient':case 'new-recipe':case 'new-menu':case 'new-event':case 'new-purchase':modal={type:a.replace('new-','')};detailEventId=null;renderModal();break;
    case 'edit-ingredient':case 'edit-recipe':case 'edit-menu':case 'edit-event':modal={type:a.replace('edit-',''),id};detailEventId=null;renderModal();break;
    case 'delete-ingredient':case 'delete-recipe':case 'delete-menu':case 'delete-event':case 'delete-purchase':safeDelete(a.replace('delete-',''),id);break;
    case 'view-event':detailEventId=id;renderDetail();break;
    case 'close-modal':modal=null;E('modal-root').innerHTML='';break;
    case 'close-detail':detailEventId=null;E('modal-root').innerHTML='';break;
    case 'add-recipe-line':addRecipeLine();break;
    case 'remove-line':b.closest('.ingredient-row')?.remove();break;
    case 'shopping-this':shoppingEvent=id;choose('shopping');break;
    case 'export-json':exportJSON();break;
    case 'export-events':exportEvents();break;
    case 'export-shopping':exportShopping();break;
    case 'print-event':printEvent(id);break;
    case 'import-json':E('json-upload')?.click();break;
    case 'clear-demo':if(confirm('¿Eliminar los datos de ejemplo y empezar con una aplicación vacía?')){db=defaultData();save();render()}break;
    case 'reset-data':if(confirm('Se eliminarán todos los datos locales. ¿Has descargado una copia?')&&confirm('Confirmación final: ¿borrar todo?')){db=defaultData();save();choose('dashboard')}break;
    case 'load-demo':if(confirm('¿Reemplazar toda tu información local por datos ficticios de ejemplo?')){db=demoData();save();choose('dashboard')}break;
  }});
  document.addEventListener('submit',ev=>{if(ev.target.id==='data-form'){ev.preventDefault();submitForm(ev.target)}});
  document.addEventListener('change',ev=>{if(ev.target.id==='choose-shopping'){shoppingEvent=ev.target.value;render()}if(ev.target.id==='json-upload'){const file=ev.target.files?.[0];if(!file)return;if(file.size>5*1024*1024){notice('El archivo de copia es demasiado grande (máximo 5 MB).');return;}file.text().then(t=>{let x;try{x=JSON.parse(t)}catch{notice('Este archivo no es un JSON válido.');return;}if(!x||![x.ingredients,x.recipes,x.menus,x.events,x.purchases].every(Array.isArray)||x.version!==1){notice('Formato de copia incompatible.');return}if(!confirm('¿Reemplazar todos los datos actuales por los de esta copia?'))return;db=x;save();choose('dashboard');notice('Copia importada.');}).catch(()=>notice('No se pudo leer la copia.'))}});
  document.addEventListener('input',ev=>{if(ev.target.hasAttribute('data-filter')){const text=ev.target.value;const pos=ev.target.selectionStart;filterText=text;const target=ev.target;const pane=target.closest('.content');if(!pane)return;const keepScroll=window.scrollY;const newContent={ingredients,recipes,events}[current]?.();if(newContent){pane.innerHTML=newContent;const newer=pane.querySelector('[data-filter]');newer?.focus();newer?.setSelectionRange(pos,pos);window.scrollTo(0,keepScroll)}}});
  document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&(modal||detailEventId)){modal=null;detailEventId=null;E('modal-root').innerHTML=''}});
  render();
})();
</script>
